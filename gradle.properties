org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Google only publishes an x86_64 linux aapt2, which this aarch64 host runs
# through qemu-user-static. The shim wraps the SDK binary for the local
# toolchain installed under /root/android-sdk.
android.aapt2FromMavenOverride=/root/android-sdk/build-tools/36.0.0/aapt2
